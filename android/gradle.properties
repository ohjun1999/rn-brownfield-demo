org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official

# AGP 9의 built-in Kotlin / new DSL은 아직 React Native gradle plugin과 호환되지 않으므로 opt-out (RN 0.88 템플릿과 동일)
android.builtInKotlin=false
android.newDsl=false

# ---- React Native ----
# New Architecture (TurboModule/Fabric). RN 0.82+ 에서는 사실상 필수.
newArchEnabled=true
hermesEnabled=true
edgeToEdgeEnabled=true
# 빌드 시간을 줄이기 위해 에뮬레이터(x86_64)와 실기기(arm64-v8a)만 빌드. 배포 시 필요한 ABI를 추가.
reactNativeArchitectures=x86_64,arm64-v8a
